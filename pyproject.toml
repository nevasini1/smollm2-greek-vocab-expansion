[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabx"
version = "0.1.0"
description = "Vocabulary expansion vs. plain continued pretraining for SmolLM2-135M -> Greek, with matched budgets and tokenizer-agnostic evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "tokenizers>=0.20",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vocabx = "vocabx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs the Hugging Face Hub (downloads the SmolLM2 tokenizer)"]
