# Laptop/CI smoke test of the whole pipeline (tiny data, 6 steps).
global_set: []
runs:
  - {config: ../smoke.yaml, set: ["run_name=base", "train.max_steps=0"]}
  - {config: ../smoke.yaml, set: ["run_name=exp1_finetune"]}
  - {config: ../smoke.yaml, set: ["run_name=exp2_extend", "tokenizer.extender=continued_bpe"]}
  - {config: ../smoke.yaml, set: ["run_name=exp2_staged", "tokenizer.extender=continued_bpe",
                                  "train.stages=[{name: a, until_frac: 0.5, trainable: [emb_new]}, {name: b, until_frac: 1.0}]"]}
report:
  name: smoke
  baseline: base
  reference: exp1_finetune
  runs: [base, exp1_finetune, exp2_extend, exp2_staged]
